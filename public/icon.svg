<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background with warm gradient -->
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7667;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f5449;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#warmGradient)"/>

  <!-- Decorative circle (subtle) -->
  <circle cx="380" cy="130" r="60" fill="#ffffff" opacity="0.08"/>

  <!-- Main leaf icon -->
  <g filter="url(#shadow)">
    <path d="M140 380c0-168 98-234 252-248 0 160-88 248-252 248Z"
          fill="none"
          stroke="#f5f1e8"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M140 380 L310 210"
          fill="none"
          stroke="#f5f1e8"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Accent dot (commitment/promise symbol) -->
  <circle cx="392" cy="132" r="18" fill="#ff7556" opacity="0.9"/>
</svg>
